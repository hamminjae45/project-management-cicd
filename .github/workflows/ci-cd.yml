name: Project Management CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ham0925/project-management-cicd:latest
            ham0925/project-management-cicd:${{ github.sha }}

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: ham0925/project-management-cicd:.*|image: ham0925/project-management-cicd:${GITHUB_SHA}|" k8s/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "chore: update image to ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi

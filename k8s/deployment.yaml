apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-management
  namespace: project-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-management
  template:
    metadata:
      labels:
        app: project-management
    spec:
      containers:
        - name: project-management
          image: ham0925/project-management-cicd:9db05b8b9461b01513df5c484b69bd4a2535aa5b
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

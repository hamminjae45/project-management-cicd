<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 관리 시스템</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <h1>Project Management</h1>
            <p>프로젝트 관리 웹 서비스</p>
        </header>

        <section class="form-card">
            <h2>새 프로젝트 등록</h2>
            <form action="/add" method="POST">
                <input type="text" name="name" placeholder="프로젝트 이름" required>
                <input type="text" name="description" placeholder="프로젝트 설명">
                <button type="submit">프로젝트 추가</button>
            </form>
        </section>

        <section>
            <h2>프로젝트 목록</h2>
            <div class="project-list">
                {% for project in projects %}
                <article class="project-card">
                    <div>
                        <h3>{{ project.name }}</h3>
                        <p>{{ project.description }}</p>
                        <span class="status">{{ project.status }}</span>
                    </div>

                    <div class="actions">
                        <form action="/edit/{{ project.id }}" method="POST">
                            <select name="status">
                                <option value="대기">대기</option>
                                <option value="진행 중">진행 중</option>
                                <option value="완료">완료</option>
                            </select>
                            <button type="submit">상태 변경</button>
                        </form>

                        <form action="/delete/{{ project.id }}" method="POST">
                            <button class="delete" type="submit">삭제</button>
                        </form>
                    </div>
                </article>
                {% else %}
                <p>등록된 프로젝트가 없습니다.</p>
                {% endfor %}
            </div>
        </section>
    </main>
</body>
</html>
